version: '3.4'

services:
  englishcentralmanagement:
    image: ${DOCKER_REGISTRY-}englishcentralmanagement
    build:
      context: .
      dockerfile: EnglishCentralManagement/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: EnglishCentreDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"